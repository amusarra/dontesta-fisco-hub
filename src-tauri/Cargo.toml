[package]
name = "dontesta-fiscohub"
version = "1.0.0"
description = "Visualizzatore di Fatture Elettroniche e Corrispettivi XML scaricati dal Portale AdE"
authors = ["Antonio Musarra <antonio.musarra@gmail.com>"]
license = "MIT"
repository = "https://github.com/amusarra/dontesta-fatturapa"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.0", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

[features]
default = [ "custom-protocol" ]
custom-protocol = [ "tauri/custom-protocol" ]
